name: Deploy cleaner to k3s

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker images
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for dir in */; do
            [ -f "$dir/Dockerfile" ] || continue
            docker build -t ${REGISTRY_HOST}:5000/${dir%/}:${IMAGE_TAG} ${dir}
            docker tag ${REGISTRY_HOST}:5000/${dir%/}:${IMAGE_TAG} ${REGISTRY_HOST}:5000/${dir%/}:latest
            docker push ${REGISTRY_HOST}:5000/${dir%/}:${IMAGE_TAG}
            docker push ${REGISTRY_HOST}:5000/${dir%/}:latest
          done

      - name: Deploy to k3s
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sudo kubectl create namespace cleaner --dry-run=client -o yaml | sudo kubectl apply -f -
          for dir in */; do
            [ -f "${dir}manifests/cronjob.yaml" ] || continue
            sed -e "s|__REGISTRY_HOST__|${REGISTRY_HOST}|g" \
                -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
                ${dir}manifests/cronjob.yaml | sudo kubectl apply -f - -n cleaner
          done

      - name: Notify Slack on success
        if: success()
        run: |
          curl -s -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"✅ cleaner deploy succeeded: `${{ github.ref_name }}` @ `${{ github.sha }}`"}'

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ cleaner deploy failed: `${{ github.ref_name }}` @ `${{ github.sha }}`"}'
